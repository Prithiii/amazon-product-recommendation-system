services:

  postgres:

    image: postgres:15

    container_name: recommender_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Admin
      POSTGRES_DB: amazon_recommender

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:

    build: ./backend

    container_name: recommender_api

    ports:
      - "8000:8000"

    depends_on:
      - postgres

  frontend:

    build: ./frontend

    container_name: recommender_ui

    ports:
      - "8501:8501"

    depends_on:
      - backend

volumes:
  postgres_data: